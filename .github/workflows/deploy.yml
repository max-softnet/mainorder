name: Deploy to SiteGround

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 18765 ssh.francescod131.sg-host.com >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload frontend dist
        run: |
          sshpass -e scp -i ~/.ssh/deploy_key -P 18765 -o StrictHostKeyChecking=no \
            -r frontend/dist/* \
            u2519-pn6yuccwnuam@ssh.francescod131.sg-host.com:~/mainorder/backend/public/
        env:
          SSHPASS: ${{ secrets.SSH_PASSPHRASE }}

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.francescod131.sg-host.com
          port: 18765
          username: u2519-pn6yuccwnuam
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 120s
          script: |
            cd ~/mainorder
            git pull origin main
            cd backend
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear
            echo "Deploy completato"
