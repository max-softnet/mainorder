name: Deploy to SiteGround

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Setup SSH agent
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_PASSPHRASE }}" | ssh-add ~/.ssh/deploy_key
          ssh-keyscan -p 18765 ssh.francescod131.sg-host.com >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Upload and deploy
        run: |
          # Crea tar del dist
          tar -czf /tmp/frontend-dist.tar.gz -C frontend/dist .

          # Copia sul server
          scp -P 18765 \
            -o StrictHostKeyChecking=no \
            /tmp/frontend-dist.tar.gz \
            u2519-pn6yuccwnuam@ssh.francescod131.sg-host.com:/tmp/frontend-dist.tar.gz

          # Estrai + git pull + migrate
          ssh -p 18765 \
            -o StrictHostKeyChecking=no \
            u2519-pn6yuccwnuam@ssh.francescod131.sg-host.com '
              set -e
              echo "=== Estrazione frontend ==="
              mkdir -p ~/mainorder/backend/public
              tar -xzf /tmp/frontend-dist.tar.gz -C ~/mainorder/backend/public/
              rm -f /tmp/frontend-dist.tar.gz
              echo "=== Git pull ==="
              cd ~/mainorder
              git pull origin main
              cd backend
              echo "=== Migrate e cache ==="
              php artisan migrate --force
              php artisan config:clear
              php artisan cache:clear
              php artisan view:clear
              echo "=== Deploy completato ==="
            '
